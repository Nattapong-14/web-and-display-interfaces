<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immediate Sign Language Translation Assistant for the Deaf</title> 
  <link rel="stylesheet" href="disstyle.css">
</head>
<body>
  <div class="header">Immediate Sign Language Translation Assistant for the Deaf</div>
  <div class="camera">
      <video id="video" autoplay playsinline></video>
  </div>
  <div class="container">
    <div class="box">
    <div class="dischat" id="dischat"></div>
      <div class="dischat-input">
        <input type="text" id="input-text" placeholder="Enter a message">
        <button id="sendBtn">Send</button>
  </div>
      </div>
    </div>
  </div>

  <script src="disscript.js"></script>
</body>
</html>
